name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - run: node scripts/verify-baseline-review-policy-browser.mjs
      - run: node scripts/verify-german-input-aliases-browser.mjs
      - run: node scripts/verify-chinese-cloze-focus-browser.mjs
      - run: node scripts/verify-german-optional-articles-browser.mjs
      - run: node scripts/verify-german-cloze-focus-browser.mjs
      - run: node scripts/verify-german-cloze-aliases-browser.mjs
      - run: node scripts/verify-german-plural-gender-browser.mjs
